<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bloomshire Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #090e1a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon {
      font-size: 20px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .title {
      font-weight: 900;
      font-size: 13px;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .badge-online {
      font-size: 9.5px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card {
      background: #111a2e;
      border: 1px solid #1e2c47;
      border-radius: 8px;
      padding: 8px;
    }
    .card-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .card-val {
      font-size: 14px;
      font-weight: 800;
      font-family: monospace;
      margin-top: 2px;
    }
    .val-gold { color: #facc15; }
    .val-energy { color: #38bdf8; }
    .val-shards { color: #818cf8; }
    .val-inv { color: #4ade80; }
    .btn-sync {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }
    .btn-sync:hover { opacity: 0.95; }
    .footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: #64748b;
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="icon"><img src="icons/icon-32.png" width="24" height="24" alt="" style="image-rendering: pixelated;"></div>
      <div>
        <div class="title">BLOOMSHIRE COMPANION</div>
        <div style="font-size:10px; color:#94a3b8;">Bloomshire Tool • Season 0</div>
      </div>
    </div>
    <span class="badge-online" id="statusBadge">● ACTIVO</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">💰 Oro en Mano</div>
      <div class="card-val val-gold" id="goldVal">--</div>
    </div>
    <div class="card">
      <div class="card-label">⚡ Energía</div>
      <div class="card-val val-energy" id="energyVal">--</div>
    </div>
    <div class="card">
      <div class="card-label">💎 Shards / AVYN</div>
      <div class="card-val val-shards" id="shardsVal">--</div>
    </div>
    <div class="card">
      <div class="card-label">🎒 Inventario</div>
      <div class="card-val val-inv" id="invVal">--</div>
    </div>
  </div>

  <button class="btn-sync" id="btnSync">⚡ Forzar sincronización</button>

  <div class="footer">
    <span id="lastSyncTxt">Esperando datos...</span>
    <a href="https://bloomshire-tool.vercel.app/" target="_blank" rel="noopener">Abrir Bloomshire Tool ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
