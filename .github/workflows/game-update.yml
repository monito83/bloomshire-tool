# Actualiza los datos oficiales del juego (Codice, habilidades, Bestiario, exploracion, arte)
# y los publica solo si cambiaron y pasan los tests y el build.
# - Todos los dias a las 06:23 (hora de Argentina) y a pedido (boton "Actualizar" en Ajustes
#   de la herramienta, o "Run workflow" en GitHub > Actions).
# - Los archivos del juego se descargan en la maquina temporal de GitHub y se descartan:
#   nunca se suben al repositorio.
# - main exige PR (regla "Proteger main"): el robot abre un PR con los cambios y lo mergea solo.
#   Para volver atras: abrir ese PR en GitHub y tocar "Revert".
# - Requiere en Settings > Actions > General > Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests".
name: Actualizar datos del juego

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo (opcional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: game-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Descargar el juego y generar los datos oficiales
        run: npm run game:update

      - name: Ver si cambio algo
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- public/data/bloomshire)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Sin novedades: los datos ya estan al dia con el juego." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./public/data/bloomshire/official/meta.json').gameVersion")" >> "$GITHUB_OUTPUT"
            git status --short -- public/data/bloomshire
          fi

      - name: Tests
        if: steps.diff.outputs.changed == 'true'
        run: npx vitest run

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npx vite build

      - name: Publicar (PR del robot, mergeado automaticamente)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.diff.outputs.version }}
        run: |
          BRANCH="bot/datos-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name "bloomshire-tool-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/bloomshire
          git commit -m "chore(datos): actualizar datos oficiales del juego a la version ${VERSION}" \
                     -m "Generado automaticamente por .github/workflows/game-update.yml."
          git push origin "$BRANCH"
          SUMMARY=$(node -e "const c=require('./public/data/bloomshire/official/changes.json').updates[0]||{};const n=(o)=>o?((o.added||[]).length+' nuevos, '+(o.removed||[]).length+' quitados, '+(o.changedCount||0)+' con cambios'):'-';console.log('- Items: '+n(c.items));console.log('- Criaturas: '+n(c.beasts));console.log('- Habilidades con cambios: '+((c.skills||[]).length))")
          BODY=$(printf 'Actualizacion automatica de los datos oficiales del juego (version %s).\n\n%s\n\nGenerado por el robot `game-update.yml`. Se mergea solo si pasaron los tests y el build. Para volver atras: boton **Revert** de este PR.' "$VERSION" "$SUMMARY")
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "chore(datos): datos oficiales del juego ${VERSION}" --body "$BODY")
          echo "PR: $PR_URL"
          if gh pr merge "$PR_URL" --merge --delete-branch; then
            { echo "### Datos actualizados a la version ${VERSION}"; echo "$SUMMARY"; echo "PR: $PR_URL"; } >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### El PR quedo abierto sin mergear: $PR_URL"; echo "Revisar la regla de main o mergearlo a mano."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
